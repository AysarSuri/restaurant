<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>نظام إدارة المطاعم الذكي 2026</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /* Apply cached brand primary before CSS/React to avoid amber flash on reload */
      (function () {
        try {
          var v = localStorage.getItem("rms-theme-primary");
          if (v && /^\d{1,3}\s+\d{1,3}%\s+\d{1,3}%$/.test(v.trim())) {
            var r = document.documentElement;
            r.style.setProperty("--primary", v.trim());
            r.style.setProperty("--accent", v.trim());
            r.style.setProperty("--ring", v.trim());
            r.style.setProperty("--warning", v.trim());
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Vazirmatn + Noto Arabic + Noto Sans: Arabic + Badini (Arabic script) + English -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
