kind = "web"
previewPath = "/"
title = "نظام إدارة المطاعم الذكي 2026"
version = "1.0.0"
id = "artifacts/rms"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26044

[services.development]
run = "pnpm --filter @workspace/rms run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rms", "run", "build" ]
publicDir = "artifacts/rms/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26044"
BASE_PATH = "/"
